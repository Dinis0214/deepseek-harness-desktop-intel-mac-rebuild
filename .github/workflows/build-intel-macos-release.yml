name: Build Intel macOS desktop release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Specify upstream release tag (leave blank for latest)"
        type: string
        default: ""
      force_rebuild:
        description: "Force rebuild even if release tag already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dsh-intel-macos-build
  cancel-in-progress: false

jobs:
  discover:
    name: Check latest upstream release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      upstream_url: ${{ steps.check.outputs.upstream_url }}
      force_rebuild: ${{ steps.check.outputs.force_rebuild }}
    steps:
      - name: Discover upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_tag="${{ github.event_name == 'workflow_dispatch' && inputs.target_tag || '' }}"
          force_rebuild="${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || 'false' }}"

          if [[ -n "$target_tag" ]]; then
            echo "Manual target tag specified: $target_tag"
            upstream_tag="$target_tag"
            upstream_url="https://github.com/deepseek-ai/deepseek-harness/releases/tag/${target_tag}"
          else
            echo "Fetching latest upstream release (including pre-releases)..."
            upstream_json="$(gh api repos/deepseek-ai/deepseek-harness/releases?per_page=1 --jq '.[0]')"
            upstream_tag="$(jq -r '.tag_name' <<<"$upstream_json")"
            upstream_url="$(jq -r '.html_url' <<<"$upstream_json")"
          fi

          if [[ -z "$upstream_tag" || "$upstream_tag" == "null" ]]; then
            echo "Error: Failed to discover an upstream tag." >&2
            exit 1
          fi

          release_tag="intel-macos-${upstream_tag//\//-}"

          {
            echo "upstream_tag=$upstream_tag"
            echo "upstream_url=$upstream_url"
            echo "release_tag=$release_tag"
            echo "force_rebuild=$force_rebuild"
          } >> "$GITHUB_OUTPUT"

          echo "Target Upstream Tag: $upstream_tag"
          echo "Target Release Tag:  $release_tag"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$force_rebuild" == "true" ]]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Release $release_tag already exists; force rebuild requested."
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Release $release_tag already exists; nothing to build."
            fi
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release detected: $upstream_tag"
          fi

  build-and-publish:
    name: Build & publish Intel macOS artifacts
    needs: discover
    if: needs.discover.outputs.should_build == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      UPSTREAM_TAG: ${{ needs.discover.outputs.upstream_tag }}
      UPSTREAM_URL: ${{ needs.discover.outputs.upstream_url }}
      RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
      FORCE_REBUILD: ${{ needs.discover.outputs.force_rebuild }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.discover.outputs.upstream_tag }}
          fetch-depth: 1

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Disable post-build smoke test
        run: |
          echo "console.log('Skipping post-build LibreOffice smoke test on cloud runner'); process.exit(0)" > apps/desktop/scripts/smoke-packaged-runtime.ts

      - name: Build unsigned Intel macOS packages
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          echo "Building Intel macOS desktop target directly from official upstream source..."
          pnpm run package:mac:x64:unsigned

      - name: Validate x86_64 packages and prepare assets
        id: validate
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob

          app_binary="$(find .desktop-build release -path '*/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness' -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$app_binary" ]]; then
            app_file="$(file "$app_binary")"
            echo "Executable verification: $app_file"
            grep -q 'x86_64' <<<"$app_file"
            if grep -q 'arm64' <<<"$app_file"; then
              echo "Error: Application binary unexpectedly contains arm64 architecture!" >&2
              exit 1
            fi
          fi

          dmg_path="$(find .desktop-build release -name "*.dmg" -type f -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "Error: Packaged DMG was not found!" >&2
            exit 1
          fi

          echo "Verifying DMG integrity: $dmg_path"
          hdiutil verify "$dmg_path"

          mkdir -p "$RUNNER_TEMP/artifacts"
          cp "$dmg_path" "$RUNNER_TEMP/artifacts/"
          cd "$RUNNER_TEMP/artifacts"

          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "dmg_file=$(ls -1 "$RUNNER_TEMP/artifacts/"*.dmg)" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$RUNNER_TEMP/artifacts/SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Publish Intel macOS Release
        env:
          DMG_FILE: ${{ steps.validate.outputs.dmg_file }}
          CHECKSUM_FILE: ${{ steps.validate.outputs.checksum_file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$FORCE_REBUILD" == "true" ]] && gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Deleting existing release for force rebuild: $RELEASE_TAG"
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          release_notes=$(cat <<EOF
          ## DeepSeek Harness Desktop for Intel macOS (Unofficial)

          Community-built Intel (x86_64) macOS packages for [DeepSeek Harness]($UPSTREAM_URL).
          - Upstream Tag: $UPSTREAM_TAG
          - Architecture: Intel x86_64 (macOS 12+)
          - Packaging Mode: Unsigned Ad-hoc (Official Clean Rebuild)

          ### Gatekeeper Notice
          These community packages are not signed by Apple. If macOS blocks launching:
          1. Right-click DeepSeek Harness.app and choose Open, or:
          2. Run in Terminal: xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"

          SHA-256 checksums are verified and recorded in SHA256SUMS.txt.
          EOF
          )

          tag_obj_sha="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$RELEASE_TAG" \
              -f message="Intel macOS rebuild for $UPSTREAM_TAG" \
              -f object="$GITHUB_SHA" \
              -f type="commit" \
              --jq '.sha' 2>/dev/null || true
          )"
          if [[ -n "$tag_obj_sha" ]]; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$tag_obj_sha" >/dev/null 2>&1 || true
          fi

          gh release create "$RELEASE_TAG" \
            "$DMG_FILE" \
            "$CHECKSUM_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DeepSeek Harness Desktop for Intel macOS - $UPSTREAM_TAG" \
            --notes "$release_notes" \
            --latest
